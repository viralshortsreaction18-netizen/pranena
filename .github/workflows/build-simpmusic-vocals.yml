name: Build SimpMusic (vocals only)

# Builds an installable SimpMusic APK that contains the real MDX-Net vocals-only
# separator, without needing write access to the SimpMusic fork: this job checks
# out that repo, applies simpmusic-vocals-only/vocals-only.patch, and publishes
# the signed APK as a release here.
on:
  workflow_dispatch:
  push:
    paths:
      - "simpmusic-vocals-only/**"
      - ".github/workflows/build-simpmusic-vocals.yml"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: simpmusic-vocals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repo (carries the patch)
        uses: actions/checkout@v4

      - name: Check out the SimpMusic source
        uses: actions/checkout@v4
        with:
          repository: viralshortsreaction18-netizen/SimpMusic
          ref: dev
          submodules: recursive
          path: simpmusic

      - name: Apply the vocals-only change
        run: |
          set -euo pipefail
          cd simpmusic
          git apply --binary "$GITHUB_WORKSPACE/simpmusic-vocals-only/vocals-only.patch"
          # The copy in THIS repo is authoritative for the audio code, so an edit here takes
          # effect on the next build without re-cutting the patch.
          cp -a "$GITHUB_WORKSPACE/simpmusic-vocals-only/core-patch/." core-patch/
          # settings.gradle.kts also does this; doing it here keeps the overlay
          # visible in the log if the two ever drift apart.
          if [ -d core-patch ]; then cp -r core-patch/* core/; fi
          echo "--- overlay files ---"
          ls core/media/media3/src/main/java/com/maxrave/media3/audio/ | grep -E "Mdx|Vocal" || true
          grep -n onnxruntime core/media/media3/build.gradle.kts || true

      - name: Apply app-level integration (R8 keeps, largeHeap)
        run: |
          cd simpmusic
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply-app-integration.py" .
          echo "--- proguard ---"
          tail -n 8 androidApp/proguard-rules.pro
          echo "--- manifest ---"
          grep -n "largeHeap" androidApp/src/main/AndroidManifest.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Configure build properties
        run: |
          cd simpmusic
          echo "" >> gradle.properties
          echo "isFullBuild=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          printf 'SENTRY_DSN=\nSENTRY_AUTH_TOKEN=\nLASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties

      - name: Export library definitions
        run: cd simpmusic && ./gradlew exportLibraryDefinitions --stacktrace --no-daemon

      - name: Compile the separator module
        run: |
          set -o pipefail
          cd simpmusic
          if ! ./gradlew :media3:compileReleaseKotlin --stacktrace --no-daemon 2>&1 | tee compile.log; then
            "$GITHUB_WORKSPACE/.github/scripts/report-failure.sh" compile.log
            exit 1
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          cd simpmusic
          if ! ./gradlew androidApp:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log; then
            "$GITHUB_WORKSPACE/.github/scripts/report-failure.sh" build.log
            exit 1
          fi

      - name: Sign the APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls /usr/local/lib/android/sdk/build-tools | sort -V | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/vocals.keystore" \
            -alias simpmusic -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass simpmusic123 -keypass simpmusic123 \
            -dname "CN=SimpMusic Vocals Only, OU=Mobile, O=SimpMusic, L=Agra, S=UP, C=IN"
          mkdir -p "$GITHUB_WORKSPACE/apks"
          for apk in simpmusic/androidApp/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk" .apk)
            case "$name" in
              *universal*) out="SimpMusic-vocals-only-universal.apk" ;;
              *arm64-v8a*) out="SimpMusic-vocals-only-arm64-v8a.apk" ;;
              *armeabi-v7a*) out="SimpMusic-vocals-only-armeabi-v7a.apk" ;;
              *x86_64*) out="SimpMusic-vocals-only-x86_64.apk" ;;
              *) out="$name.apk" ;;
            esac
            echo "== $name -> $out"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/vocals.keystore" \
              --ks-pass pass:simpmusic123 --key-pass pass:simpmusic123 \
              --out "$GITHUB_WORKSPACE/apks/$out" "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify "$GITHUB_WORKSPACE/apks/$out"
            ls -lh "$GITHUB_WORKSPACE/apks/$out"
          done

      - name: Verify the APK actually contains what vocals-only needs
        run: |
          set -euo pipefail
          APK=$(ls "$GITHUB_WORKSPACE"/apks/SimpMusic-vocals-only-universal.apk \
              "$GITHUB_WORKSPACE"/apks/SimpMusic-vocals-only-arm64-v8a.apk 2>/dev/null | head -1)
          echo "inspecting: $APK"
          unzip -l "$APK" | grep -Ei "libonnxruntime|libc\+\+|libandroid" | head -20
          unzip -l "$APK" | grep -qi "libonnxruntime" || {
            echo "::error title=missing native lib::no onnxruntime native library in the APK; vocals-only would crash with UnsatisfiedLinkError"
            exit 1
          }
          echo "--- is the separator class in the dex? ---"
          unzip -p "$APK" classes.dex > "$RUNNER_TEMP/classes.dex" 2>/dev/null || true
          unzip -l "$APK" | grep -c "classes.*\.dex" || true
          strings "$APK" 2>/dev/null | grep -m3 "MdxVocalAudioProcessor" || echo "(class names are minified; verified by the keep rules above)"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-vocals-only
          path: apks/*.apk

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="simpmusic-vocals-only-v3"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" apks/*.apk \
            --title "SimpMusic — vocals only v3 (diagnostics)" \
            --notes "v3 records what happens when vocals-only is switched on, so the next crash can be read instead of guessed.

          * Every step of the vocals path now logs before it runs (toggle, model download, session
            load, each chunk of inference) into the app log and into a text file.
          * An uncaught exception handler writes the full stack trace to
            Android/data/com.maxrave.simpmusic/files/vocals-only.txt and to Settings > Developer
            option > App log.
          * Loading the model now checks free RAM first (needs ~700 MB); below that it stops with a
            message instead of letting the native allocator kill the process.
          * Only one player instance runs separation; previously every ExoPlayer in the process built
            its own 28 MB separator.
          * R8 keep rules, largeHeap, Throwable catches and worker-thread loading from v2 are kept.

          If it still crashes: open the app, go to Settings > Developer option > App log, and send
          that, or send the file above. It names the last operation that ran.

          Pick the APK for your phone: arm64-v8a (almost all modern phones), armeabi-v7a (older),
          or universal if unsure. Signed with a key from this build, so uninstall the old app first." \
            --prerelease
